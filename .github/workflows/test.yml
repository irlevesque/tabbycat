name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  MONGODB_VERSION: '6'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:${{ env.MONGODB_VERSION }}
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci
      
      - name: Run Backend Tests
        run: |
          cd backend
          npm test -- --coverage --maxWorkers=2
      
      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v3
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Extension Dependencies
        run: |
          cd extension
          npm ci
      
      - name: Run Extension Tests
        run: |
          cd extension
          npm test -- --coverage --maxWorkers=2
      
      - name: Upload Extension Coverage
        uses: actions/upload-artifact@v3
        with:
          name: extension-coverage
          path: extension/coverage/
          retention-days: 7

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Root Dependencies
        run: npm ci
      
      - name: Typecheck Backend
        run: |
          cd backend
          npm run typecheck
      
      - name: Typecheck Extension
        run: |
          cd extension
          npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Root Dependencies
        run: npm ci
      
      - name: Run Lint
        run: |
          npm run lint

  build-extension:
    runs-on: ubuntu-latest
    needs: [backend-tests, extension-tests]
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Extension Dependencies
        run: |
          cd extension
          npm ci
      
      - name: Build Extension
        run: |
          cd extension
          npm run build
      
      - name: Upload Extension Build
        uses: actions/upload-artifact@v3
        with:
          name: extension-build
          path: extension/dist/
          retention-days: 7

  backend-build:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci
      
      - name: Build Backend
        run: |
          cd backend
          npm run build
      
      - name: Upload Backend Build
        uses: actions/upload-artifact@v3
        with:
          name: backend-build
          path: backend/dist/
          retention-days: 7